<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="面向公司日常数据整理与图像处理的本地优先工具集。">
  <title>日常工作工具</title>
  <link rel="stylesheet" href="assets/design-system.css">
  <script src="assets/design-system.js" defer></script>
  <script src="assets/home-dashboard.js" defer></script>
</head>
<body>
  <main class="container home-dashboard" id="mainContent">
    <header class="home-dashboard__header">
      <div>
        <span class="section-kicker">WORKSPACE</span>
        <h1 id="homeTitle">常用工具</h1>
      </div>
      <div class="home-dashboard__actions">
        <button class="button button--quiet" id="resetFavorites" type="button">恢复默认</button>
        <button class="info-button" type="button" aria-label="查看常用工具说明" data-tooltip="从下方加入或移出工具。按住拖动手柄可排序；聚焦手柄后也可使用上下方向键。顺序仅保存在当前浏览器。">i</button>
      </div>
    </header>

    <section class="favorites-panel" aria-labelledby="homeTitle">
      <ol class="favorite-tools" id="favoriteTools"></ol>
      <p class="favorite-tools__empty" id="favoriteToolsEmpty" hidden>暂未设置常用工具，可从下方加入。</p>
      <p class="visually-hidden" id="favoriteToolsStatus" aria-live="polite"></p>
    </section>

    <section class="all-tools" aria-labelledby="allToolsTitle">
      <div class="section-heading">
        <h2 id="allToolsTitle">全部工具</h2>
        <span>8</span>
      </div>

      <div class="tool-directory-grid">
        <section class="tool-directory-group" aria-labelledby="dataToolsTitle">
          <h3 id="dataToolsTitle">数据整理</h3>
          <ul class="home-tool-list">
            <li class="home-tool-row" data-tool-id="regional" data-tool-name="区域宣发统计" data-tool-href="regional-statistics.html" data-tool-category="数据整理" data-tool-description="按区域和部门筛选宣发数据并导出。">
              <a href="regional-statistics.html"><span>01</span><strong>区域宣发统计</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="checkin" data-tool-name="未打卡人员统计" data-tool-href="checkin-statistics.html" data-tool-category="数据整理" data-tool-description="对比人员名单与打卡记录。">
              <a href="checkin-statistics.html"><span>02</span><strong>未打卡人员统计</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="excel-filter" data-tool-name="电商关键词报表" data-tool-href="excel_filter.html" data-tool-category="数据整理" data-tool-description="按关键词筛选订单并汇总金额。">
              <a href="excel_filter.html"><span>03</span><strong>电商关键词报表</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="multi-table" data-tool-name="Excel 多表查询" data-tool-href="excel_query_multi_table.html" data-tool-category="数据整理" data-tool-description="连接最多十张数据表并导出结果。">
              <a href="excel_query_multi_table.html"><span>04</span><strong>Excel 多表查询</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
          </ul>
        </section>

        <section class="tool-directory-group" aria-labelledby="imageToolsTitle">
          <h3 id="imageToolsTitle">图像处理</h3>
          <ul class="home-tool-list">
            <li class="home-tool-row" data-tool-id="image-batch" data-tool-name="图片批量处理" data-tool-href="image-batch-processing.html" data-tool-category="图像处理" data-tool-description="批量叠加底图并导出压缩包。">
              <a href="image-batch-processing.html"><span>05</span><strong>图片批量处理</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="image-splitter" data-tool-name="图片分割" data-tool-href="image-splitter/index.html" data-tool-category="图像处理" data-tool-description="按比例和网格切分图片。">
              <a href="image-splitter/index.html"><span>06</span><strong>图片分割</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="photo-watermark" data-tool-name="照片水印" data-tool-href="photo-watermark/index.html" data-tool-category="图像处理" data-tool-description="批量添加文字或磨砂水印。">
              <a href="photo-watermark/index.html"><span>07</span><strong>照片水印</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
            <li class="home-tool-row" data-tool-id="congrats" data-tool-name="喜报生成" data-tool-href="congrats-generator.html" data-tool-category="图像处理" data-tool-description="编辑文案并批量生成喜报。">
              <a href="congrats-generator.html"><span>08</span><strong>喜报生成</strong></a>
              <button type="button" data-action="toggle-favorite">加入常用</button>
            </li>
          </ul>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
