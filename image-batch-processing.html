<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量图片叠加工具</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .upload-area {
      margin: 20px 0;
      padding: 20px;
      border: 2px dashed var(--border-color, #ced4da);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upload-area:hover {
      border-color: var(--primary-color, #0d6efd);
      background-color: rgba(59, 130, 246, 0.05);
    }

    .upload-hint {
      font-size: 12px;
      color: #666;
      margin: 5px 0 0;
    }

    .template-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .template-option {
      flex: 1 1 220px;
      margin: 0;
    }

    .template-option .form-check-label {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border-color, #ced4da);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .template-option input:checked + .form-check-label {
      border-color: var(--primary-color, #0d6efd);
      background: rgba(59, 130, 246, 0.08);
    }

    .template-option-title {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .template-option-desc {
      display: block;
      font-size: 12px;
      color: #666;
    }

    .overlay-preview-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .overlay-preview-wrap .delete-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      background: transparent;
      color: #dc3545;
      border: 1px solid #dc3545;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .overlay-preview {
      max-width: 100%;
      max-height: 220px;
      margin-top: 10px;
      border-radius: 6px;
    }

    .thumb-list {
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .thumb-item {
      position: relative;
      width: 80px;
      height: 80px;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .thumb-item-invalid {
      font-size: 10px;
      color: #666;
    }

    .thumb-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 8px;
      padding: 2px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: transparent;
      color: #dc3545;
      border: 1px solid #dc3545;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      cursor: pointer;
      z-index: 2;
    }

    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .preview-item {
      position: relative;
      border: 1px solid var(--border-color, #ced4da);
      padding: 5px;
      border-radius: 5px;
      background: #fafafa;
      transition: all 0.2s ease;
    }

    .preview-item:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .preview-item-error {
      background: #ffebee;
    }

    .preview-img {
      max-width: 150px;
      max-height: 150px;
      display: block;
    }

    .export-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #28a745;
      font-size: 12px;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }

    .export-btn:hover {
      background: #218838;
    }

    .loading {
      color: var(--text-color, #212529);
      text-align: center;
      margin: 20px 0;
      display: none;
      padding: 10px;
      background-color: rgba(59, 130, 246, 0.1);
      border-radius: 4px;
    }

    .action-buttons .btn {
      margin: 0 6px 10px;
    }
  </style>
</head>
<body>
  <div class="container position-relative py-4">
    <div class="return-button" style="position: absolute; top: 20px; right: 20px;">
      <a href="index.html" class="btn btn-secondary btn-sm">返回导航页面</a>
    </div>

    <header class="mb-4">
      <h1 class="text-center">批量图片叠加工具</h1>
      <p class="text-center text-muted mb-0">本地批量合成，支持早安图文与推广海报两种底图模板</p>
    </header>

    <div class="card mb-4">
      <div class="card-header">选择底图模板</div>
      <div class="card-body">
        <div class="template-options">
          <div class="form-check template-option">
            <input class="form-check-input visually-hidden" type="radio" name="templateType" id="templateMorning" value="morning" checked>
            <label class="form-check-label" for="templateMorning">
              <span class="template-option-title">早安图文</span>
              <span class="template-option-desc">默认使用原「日常图文模板」，保持原有缩放与叠加逻辑</span>
            </label>
          </div>
          <div class="form-check template-option">
            <input class="form-check-input visually-hidden" type="radio" name="templateType" id="templatePromotion" value="promotion">
            <label class="form-check-label" for="templatePromotion">
              <span class="template-option-title">推广海报</span>
              <span class="template-option-desc">保持上传图原始宽高比，下方拼接底栏（随图片宽度等比缩放）</span>
            </label>
          </div>
        </div>

        <div class="upload-area" id="overlayImageUpload">
          <p>正在加载默认底图...</p>
          <input type="file" id="overlayFile" accept="image/*" hidden>
        </div>
        <p class="upload-hint mb-0">也可点击上方区域上传自定义底图，覆盖当前模板</p>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">批量上传下层图片</div>
      <div class="card-body">
        <div class="upload-area" id="backgroundImagesUpload">
          <div class="upload-placeholder">
            <p class="mb-1">点击批量上传下层图片（需要叠加的图片）</p>
            <p class="upload-hint">支持单个文件、多个文件或整个文件夹上传</p>
          </div>
          <input type="file" id="backgroundFiles" accept="image/*" multiple hidden>
        </div>
        <div class="text-center mt-3">
          <button type="button" id="folderUploadBtn" class="btn btn-outline-secondary btn-sm">上传文件夹</button>
          <input type="file" id="folderInput" accept="image/*" webkitdirectory hidden>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">图片处理</div>
      <div class="card-body">
        <div class="text-center action-buttons">
          <button type="button" id="processBtn" class="btn btn-primary" disabled>开始处理图片</button>
          <button type="button" id="batchDownloadBtn" class="btn btn-danger" disabled>批量下载所有合成图 (ZIP)</button>
        </div>
        <div class="loading" id="loadingText">正在处理图片，请稍候...</div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">预览结果</div>
      <div class="card-body">
        <div id="previewContainer"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="image-batch-processing/js/script.js"></script>
</body>
</html>
