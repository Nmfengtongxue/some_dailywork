<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Image Splitter - 免费在线分割图像</title>
  <meta name="description" content="在线将图像分割为 2、3、6、9 或更多相等部分，支持 4:5、3:4、1:1 预设。可下载单个图像或 ZIP 文件。免费，无需注册。" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="../assets/design-system.css" />
  <script src="js/jszip.min.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="../assets/design-system.js" defer></script>
</head>
<body>
  <div class="page">
    <main class="image-splitter-workspace" id="mainContent">
      <div id="landingView">
        <section class="tool-entry-screen" id="hero">
          <div class="container">
            <header class="tool-page-heading">
              <div>
                <span class="section-kicker">IMAGE WORKBENCH</span>
                <h1>图片分割</h1>
              </div>
              <button class="info-button" type="button" aria-label="查看图片分割说明" data-tooltip="支持 JPG、PNG、WebP，单个文件不超过 50 MB。图片在浏览器本地处理，可导出单张或 ZIP。">i</button>
            </header>
            <div class="upload-card compact-upload-card">
              <div class="upload-zone" id="uploadZone">
                <div class="upload-icon-wrap">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
                <h2>拖入图片</h2>
                <button type="button" class="btn btn-primary" id="chooseBtn">选择图片</button>
                <p class="upload-hint">JPG · PNG · WebP · ≤ 50 MB</p>
              </div>
              <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp" hidden />
            </div>
          </div>
        </section>
      </div>

      <div id="toolView" class="hidden">
        <div class="container tool-container">
          <header class="tool-page-heading">
            <div>
              <span class="section-kicker">IMAGE WORKBENCH</span>
              <h1>图片分割</h1>
            </div>
            <button class="info-button" type="button" aria-label="查看分割模式说明" data-tooltip="垂直适合轮播，水平适合横向布局，网格适合宫格素材。先选择范围，再分割并下载。">i</button>
          </header>
          <div class="tool-panel">
            <aside class="tool-sidebar">
              <div class="control-group">
                <p class="control-label">宽高比</p>
                <div class="btn-grid" id="aspectRatioBtns">
                  <button type="button" class="option-btn active" data-ratio="default">默认</button>
                  <button type="button" class="option-btn" data-ratio="4:5">竖向 4:5</button>
                  <button type="button" class="option-btn" data-ratio="3:4">竖向 3:4</button>
                  <button type="button" class="option-btn" data-ratio="1:1">方形 1:1</button>
                </div>
              </div>
              <div class="control-group">
                <p class="control-label">选择分割模式</p>
                <div class="mode-btns" id="modeBtns">
                  <button type="button" class="option-btn" data-mode="vertical">垂直</button>
                  <button type="button" class="option-btn" data-mode="horizontal">水平</button>
                  <button type="button" class="option-btn active" data-mode="grid">网格</button>
                </div>
              </div>
              <div class="control-group">
                <label class="control-label">行</label>
                <div class="stepper">
                  <button type="button" class="stepper-btn" id="rowsMinus">−</button>
                  <input type="number" id="rowsInput" min="1" max="10" value="3" />
                  <button type="button" class="stepper-btn" id="rowsPlus">+</button>
                </div>
              </div>
              <div class="control-group">
                <label class="control-label">列</label>
                <div class="stepper">
                  <button type="button" class="stepper-btn" id="colsMinus">−</button>
                  <input type="number" id="colsInput" min="1" max="10" value="3" />
                  <button type="button" class="stepper-btn" id="colsPlus">+</button>
                </div>
              </div>
              <div class="control-group">
                <label class="control-label" for="gridLineWidth">网格线宽度: <span id="gridLineWidthVal">2</span>px</label>
                <input type="range" id="gridLineWidth" min="0" max="10" value="2" />
              </div>
              <div class="control-group">
                <label class="control-label" for="outputFormat">导出格式</label>
                <select id="outputFormat">
                  <option value="jpg">JPG</option>
                  <option value="png">PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </div>
              <div class="tool-actions">
                <button type="button" class="btn btn-primary btn-block" id="splitBtn">分割图像</button>
                <button type="button" class="btn btn-success btn-block" id="downloadAllBtn" disabled>全部下载</button>
              </div>
            </aside>
            <div class="tool-preview">
              <div class="preview-area" id="previewArea">
                <p class="preview-placeholder">请先上传图像</p>
              </div>
              <div class="preview-footer">
                <button type="button" class="btn btn-secondary" id="reuploadBtn">重新上传图片</button>
              </div>
            </div>
          </div>
        </div>
        <input type="file" id="toolFileInput" accept=".jpg,.jpeg,.png,.webp" hidden />
      </div>
      <div class="tool-script-hooks" hidden aria-hidden="true">
        <a href="#" id="logoHome">图片分割</a>
        <button type="button" id="menuToggle">菜单</button>
        <nav id="mobileNav" class="hidden"></nav>
        <div id="faqList"></div>
      </div>
    </main>
  </div>
</body>
</html>
